<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Scrapbook Advice</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 12px; width: 420px;}
    h1 { font-size: 16px; margin: 0 0 8px; }
    .item { border: 1px solid #ddd; padding: 8px; margin-bottom: 8px; border-radius: 6px; background: #fafafa; }
    .meta { font-size: 12px; color: #555; margin-bottom: 6px; }
    pre { white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; background:#fff;padding:8px;border-radius:4px;border:1px solid #eee;}
    button { margin-right:8px; }
    .controls { margin-bottom:8px; display:flex; gap:8px; }
    .no-items { color:#666; font-size:13px; }
  </style>
</head>
<body>
  <h1>Scrapbook Advice</h1>
  <div class="controls">
    <button id="refresh">Refresh</button>
  </div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
